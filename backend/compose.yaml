# Local development database. Spring Boot starts this automatically on
# `./mvnw spring-boot:run` (spring-boot-docker-compose). Tests use
# Testcontainers with the same image instead.
services:
  postgres:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_DB: practice_planning
      POSTGRES_USER: practice_planning
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
