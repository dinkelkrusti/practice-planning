name: Vulnerability scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, to catch new advisories for dependencies that did not change.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scans backend/pom.xml (with transitive dependencies) and both pnpm lockfiles.
      # Exceptions live in osv-scanner.toml, each with a reason and an expiry date.
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            ./

  report-nightly-failure:
    name: Open an issue for new vulnerabilities
    needs: osv-scanner
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly vulnerability scan found issues ($(date -u +%F))" \
            --body "The nightly OSV-Scanner run on main failed: $RUN_URL. Update the dependency, or add a documented, expiring exception to osv-scanner.toml."
