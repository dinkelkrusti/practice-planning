name: Backend

on:
  pull_request:
    paths: ['backend/**', 'api/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'api/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Generates the server interfaces from api/openapi.bundled.yaml, compiles,
      # and runs all tests (integration tests use Testcontainers with Docker).
      - run: ./mvnw -B -ntp verify
